# Venture manifest — the core rescans this every 60s.
slug: infinite-arcade
name: Infinite Arcade
description: AI game studio shipping a new browser game daily, growing into a TikTok-style platform to make and remix games. Public brand (placeholder) is Daycade.
# idea | planned | building | live | paused | retired
# Scheduled jobs only run when status is building or live.
status: building
owner: moonshots          # brand/operator; never Don's personal name
links:
  site: https://moon.sparelimbstudios.com/arcade/
  repo: https://github.com/milesmillerart/moonshots/tree/main/ventures/infinite-arcade

# Background jobs. `command` runs with bash in this folder.
# schedule: 5-field cron (server time, UTC) or omit for manual-only.
# approval: financial | credential | external | other  -> job is blocked until
#           Don approves it in the dashboard (single use per run).
jobs:
  - name: heartbeat
    schedule: "*/30 * * * *"
    command: ./jobs/heartbeat.sh
    timeout: 60
  # Daily release train: rebuild + redeploy so queued games go live on their date.
  # Stub for future "ship a new game" automation. Local only, calls no paid API.
  - name: ship-daily
    schedule: "5 5 * * *"     # 05:05 UTC = 00:05 US Eastern (standard time)
    command: ./jobs/ship-daily.sh
    timeout: 300
  # - name: publish-release
  #   command: ./jobs/publish.sh
  #   approval: external

# Where this venture deploys.
#   none
#   static:    {type: static, source: public, path: /infinite-arcade}  -> web root subpath
#   container: {type: container, context: app, port: 8101, container_port: 8000, memory: 256m}
#              -> podman image + systemd --user unit, bound to 127.0.0.1:<port>
deploy:
  type: static        # planned: games served from the main site
  source: public
  path: /arcade

# Revenue model and checkpoints; filled in during research.
business:
  revenue:
    - CrazyGames / Poki revenue share once games are accepted (accounts owned by Don, under the brand)
    - Display ads on the arcade site later (hook in place, no network chosen; needs approval)
  costs: []               # anything here needs Don's explicit approval first
