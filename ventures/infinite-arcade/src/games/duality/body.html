<main id="app">
  <header class="top">
    <div><div class="eyebrow" id="mode">Daily #1</div><h1>Duality</h1></div>
    <div class="timer" id="timer">0:00</div>
  </header>
  <div id="board" class="board" role="grid" aria-label="Duality puzzle"></div>
  <p class="rules">Fill every cell with a <b class="s">sun</b> or a <b class="m">moon</b>. Each row and column holds 3 of each, and no 3 of the same can sit side by side.</p>
  <div class="bar">
    <button id="undo" class="b">Undo</button>
    <button id="hint" class="b">Hint <small>+15s</small></button>
    <button id="clear" class="b">Clear</button>
    <button id="switch" class="b">Practice</button>
  </div>
</main>
