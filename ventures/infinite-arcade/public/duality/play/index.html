<!doctype html>
<html lang="en" data-game="duality"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Duality</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0a17">
<!-- PORTAL HOOK: portal builds insert the CrazyGames or Poki SDK <script> here, before kit.js. Kit.sdk forwards events to it. -->
<link rel="stylesheet" href="style.css">
</head><body>
<main id="app">
  <header class="top">
    <div><div class="eyebrow" id="mode">Daily #1</div><h1>Duality</h1></div>
    <div class="timer" id="timer">0:00</div>
  </header>
  <div id="board" class="board" role="grid" aria-label="Duality puzzle"></div>
  <p class="rules">Fill every cell with a <b class="s">sun</b> or a <b class="m">moon</b>. Each row and column holds 3 of each, and no 3 of the same can sit side by side.</p>
  <div class="bar">
    <button id="undo" class="b">Undo</button>
    <button id="hint" class="b">Hint <small>+15s</small></button>
    <button id="clear" class="b">Clear</button>
    <button id="switch" class="b">Practice</button>
  </div>
</main>

<script src="kit.js"></script>
<script src="game.js"></script>
</body></html>
