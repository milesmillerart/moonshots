# Moonshots dashboard at https://moon.sparelimbstudios.com/ops/
# Paste INSIDE the existing <VirtualHost *:443> block for moon.sparelimbstudios.com.
# The app enforces its own HTTP Basic auth (credentials in /srv/moonshots/secrets/dashboard.env).
<Location /ops/>
    ProxyPass http://127.0.0.1:8100/
    ProxyPassReverse http://127.0.0.1:8100/
    RequestHeader set X-Forwarded-Proto "https"
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set X-Frame-Options "DENY"
</Location>
RedirectMatch ^/ops$ /ops/
